name: Build Kenisha Cute APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kenisha
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify uploaded files
        run: |
          test -f kenisha-cute-app-code.zip
          test -f kenisha-media-pack-01.zip
          test -f kenisha-media-pack-02.zip
          test -f kenisha-media-pack-03.zip
          test -f kenisha-media-pack-04.zip
          test -f kenisha-media-pack-05.zip
          test -f kenisha-media-pack-06.zip

      - name: Extract app code
        run: |
          rm -rf project
          mkdir -p project
          unzip -q kenisha-cute-app-code.zip -d project

      - name: Extract media
        run: |
          mkdir -p project/app/src/main/assets
          for f in kenisha-media-pack-*.zip; do
            unzip -q "$f" -d project/app/src/main/assets
          done

      - name: Verify original media
        run: |
          PHOTOS=$(find project/app/src/main/assets/photos -type f | wc -l)
          VIDEOS=$(find project/app/src/main/assets/videos -type f | wc -l)

          echo "Photos: $PHOTOS"
          echo "Videos: $VIDEOS"

          test "$PHOTOS" -eq 59
          test "$VIDEOS" -eq 18

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kenisha-Cute-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
