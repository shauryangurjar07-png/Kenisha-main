name: Build Kenisha Cute APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kenisha
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check files
        run: |
          ls -lh
          echo "Checking required files..."
          test -f kenisha-cute-app-code.zip
          test -f kenisha-media-pack-01.zip
          test -f kenisha-media-pack-02.zip
          test -f kenisha-media-pack-03.zip
          test -f kenisha-media-pack-04.zip
          test -f kenisha-media-pack-05.zip
          test -f kenisha-media-pack-06.zip

      - name: Extract app
        run: |
          rm -rf project
          mkdir project
          unzip -q kenisha-cute-app-code.zip -d project

      - name: Extract media
        run: |
          mkdir -p project/app/src/main/assets
          unzip -q kenisha-media-pack-01.zip -d project/app/src/main/assets
          unzip -q kenisha-media-pack-02.zip -d project/app/src/main/assets
          unzip -q kenisha-media-pack-03.zip -d project/app/src/main/assets
          unzip -q kenisha-media-pack-04.zip -d project/app/src/main/assets
          unzip -q kenisha-media-pack-05.zip -d project/app/src/main/assets
          unzip -q kenisha-media-pack-06.zip -d project/app/src/main/assets

      - name: Verify media
        run: |
          echo "Photos:"
          find project/app/src/main/assets/photos -type f | wc -l
          echo "Videos:"
          find project/app/src/main/assets/videos -type f | wc -l

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show project
        working-directory: project
        run: |
          echo "Project:"
          find . -maxdepth 3 -type f | sort

      - name: Build APK
        working-directory: project
        run: |
          gradle assembleDebug --no-daemon --stacktrace --info

      - name: Find APK
        run: |
          find project -name "*.apk" -type f -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kenisha-Cute-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
